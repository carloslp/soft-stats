<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cachorros de Sinaloa — Standings</title>
    <meta name="description" content="Standings por temporada con métricas de rendimiento y sabermetría." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles/stand.css" />
    <script>
      (function () {
        var t = localStorage.getItem('theme');
        var d = document.documentElement;
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          d.classList.add('dark');
        } else if (t === 'light') {
          d.classList.add('light');
        }
      })();
    </script>
  </head>
  <body>
    <div class="stand-page">
      <header class="stand-header">
        <a href="index.html" class="stand-back" aria-label="Regresar">&#8592;</a>
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/89/Chicago_Cubs_Cap_Insignia.svg" alt="Cachorros de Sinaloa logo" class="stand-logo" width="44" height="44" />
        <div>
          <h1>Standings</h1>
          <p>Clasificación por temporada</p>
        </div>
        <button id="dark-mode-toggle" class="stand-back" type="button" aria-label="Cambiar a modo oscuro" title="Modo oscuro">
          <svg class="dm-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" width="18" height="18"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="dm-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" width="18" height="18" hidden><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </header>

      <main>
        <div class="controls">
          <label for="season-select">Temporada:</label>
          <select id="season-select" aria-label="Seleccionar temporada"></select>
        </div>

        <section id="state-loading" class="state" role="status" aria-live="polite">Cargando standings…</section>
        <section id="state-error" class="state state-error" role="alert" hidden>
          <p id="error-message">Error al cargar los datos.</p>
          <button id="retry-btn" type="button">Reintentar</button>
        </section>
        <section id="state-empty" class="state" hidden>No hay juegos finalizados para esta temporada.</section>

        <section id="league-summary" class="summary" hidden>
          <article class="card">
            <span class="label">Paridad competitiva</span>
            <strong id="parity-value">—</strong>
          </article>
          <article class="card">
            <span class="label">Factor ofensivo</span>
            <strong id="offense-value">—</strong>
            <small id="offense-tag">—</small>
          </article>
        </section>

        <div class="table-wrap" id="table-wrapper" hidden>
          <table aria-label="Tabla de standings">
            <thead>
              <tr>
                <th>Equipo</th><th>JJ</th><th>G</th><th>P</th><th>PCT</th><th>GB</th><th>CA</th><th>CP</th><th>DIF</th><th>C/J</th><th>CP/J</th><th>LOC</th><th>VIS</th><th>1-RUN</th><th>SHO</th><th>EXP-PCT</th><th>STRK</th><th>L10</th><th>U5</th>
              </tr>
            </thead>
            <tbody id="standings-body"></tbody>
          </table>
        </div>
      </main>
    </div>

    <script src="scripts/stand.js"></script>
    <script src="scripts/dark-mode.js"></script>
  </body>
</html>
