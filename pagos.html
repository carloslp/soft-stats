<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cachorros de Sinaloa — Seguimiento de Pagos</title>
    <meta name="description" content="Seguimiento de pagos de inscripción y juegos por jugador." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles/pagos.css" />
    <script>
      (function () {
        var t = localStorage.getItem('theme');
        var d = document.documentElement;
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          d.classList.add('dark');
        } else if (t === 'light') {
          d.classList.add('light');
        }
      })();
    </script>
  </head>
  <body>
    <header class="pay-header">
      <div class="pay-header-top">
        <a href="index.html" class="pay-back-btn" aria-label="Regresar a estadísticas">&#8592;</a>
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/89/Chicago_Cubs_Cap_Insignia.svg" alt="Cachorros de Sinaloa logo" class="pay-logo" width="44" height="44" />
        <div class="pay-header-text">
          <h1 class="pay-header-title">Cachorros de Sinaloa</h1>
          <p class="pay-header-subtitle">Seguimiento de pagos</p>
        </div>
        <button id="dark-mode-toggle" class="pay-back-btn" type="button" aria-label="Cambiar a modo oscuro" title="Modo oscuro" style="margin-left:auto;">
          <svg class="dm-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" width="18" height="18"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="dm-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" width="18" height="18" hidden><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </div>
    </header>

    <main class="pay-main">
      <section class="pay-state pay-state--loading" id="pay-loading" role="status" aria-live="polite">
        <div class="pay-spinner" aria-hidden="true"></div>
        <p>Cargando pagos...</p>
      </section>

      <section class="pay-state pay-state--error" id="pay-error" role="alert" aria-live="assertive" hidden>
        <p id="pay-error-msg">Error al cargar los datos de pagos.</p>
        <button id="pay-retry-btn" class="pay-btn" type="button">Reintentar</button>
      </section>

      <section id="pay-content" hidden>
        <div class="pay-table-wrap" role="region" aria-label="Tabla de seguimiento de pagos" tabindex="0">
          <table class="pay-table" id="pay-table">
            <thead id="pay-thead"></thead>
            <tbody id="pay-tbody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="pay-footer">
      <p>&copy; <span id="pay-footer-year"></span> Cachorros de Sinaloa.</p>
    </footer>

    <script src="scripts/pagos.js"></script>
    <script src="scripts/dark-mode.js"></script>
  </body>
</html>
